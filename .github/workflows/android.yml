name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo package versions
        run: npx expo install --fix

      - name: Locate Android SDK
        id: sdk
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1 || true)"
          fi
          echo "Using sdkmanager: $SDKM"
          echo "sdkmanager=$SDKM" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        run: yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null 2>&1 || true

      - name: Ensure SDK components
        run: |
          "${{ steps.sdk.outputs.sdkmanager }}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory
        run: printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n' >> android/gradle.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/0kay-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 0kay-app-apk
          path: out/0kay-app.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: 0KAY App v0.1.0
          body: |
            Android APK for the 0KAY companion (React Native + Expo).

            - 连接自托管 0KAY Core（HTTP + Token / PIN / 设备配对）
            - 聊天（SSE 流式）、状态、任务与会话、审批与提问
            - 供应商/模型、设置、插件、记忆、技能、通知、用量

            APK 使用调试签名，可直接侧载安装。
          files: out/0kay-app.apk
          fail_on_unmatched_files: true
