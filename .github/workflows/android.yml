name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo package versions
        run: npx expo install --fix

      - name: Locate Android SDK
        id: sdk
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1 || true)"
          fi
          echo "Using sdkmanager: $SDKM"
          echo "sdkmanager=$SDKM" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        run: yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null 2>&1 || true

      - name: Ensure SDK components
        run: |
          "${{ steps.sdk.outputs.sdkmanager }}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Debug inline module mirror
        run: |
          set -x
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking \
            mirror-kotlin-inline-modules \
            --kotlin-files-mirror-directory "$PWD/node_modules/expo/android/src/main/java/inline/modules" \
            --inline-modules-list-directory "$PWD/node_modules/expo/android/build/inline/modules" \
            --watched-directories-serialized "[]"
          echo "mirror exit=$?"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --info > /tmp/gradle.log 2>&1 || {
            echo "=== GRADLE FAILED; relevant lines ==="
            grep -n -iE "mirror-kotlin|Generation path|expo-modules-autolinking failed|node:|ERR_|Cannot find|What went wrong|error:" /tmp/gradle.log | tail -n 100
            echo "=== last 120 lines ==="
            tail -n 120 /tmp/gradle.log
            exit 1
          }
          tail -n 40 /tmp/gradle.log

      - name: Rename artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/0kay-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 0kay-app-apk
          path: out/0kay-app.apk
          if-no-files-found: error
          retention-days: 90
